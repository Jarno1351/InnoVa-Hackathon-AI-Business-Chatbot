<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetic Industries Dashboard</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <header class="top-section">
            <div class="profile-avatar">K</div>
            <div class="company-info">
                <h1 id="company-name">Kinetic Industries</h1>
                <p id="company-details">A leading provider of integrated branches</p>
                <p id="company-location" class="company-location"><i data-lucide="map-pin" class="location-icon"></i> Metro Manila, Philippines</p>
            </div>
        </header>

        <main class="bottom-section">
            <nav class="tab-container">
                <div class="tab-wrapper">
                    <button class="tab-btn active" data-tab="branches">BRANCHES</button>
                    <button class="tab-btn" data-tab="products">PRODUCTS</button>
                    <button class="tab-btn" data-tab="services">SERVICES</button>
                    <button class="tab-btn" data-tab="about" disabled>ABOUT</button>
                    <button class="tab-btn" data-tab="more" disabled>
                        MORE <i data-lucide="chevron-down" class="inline-icon"></i>
                    </button>
                </div>
            </nav>

            <div id="root-control-bar" class="control-action-bar">
                <button id="add-branch-root-btn" class="primary-add-btn">
                    <i data-lucide="plus"></i> <span>Add Branch</span>
                </button>
            </div>

            <div id="tab-content-panel" class="content-panel">
                <div class="loader">Loading dynamic data...</div>
            </div>
        </main>
        
    </div>

    <div id="entry-modal" class="entry-modal hidden" aria-hidden="true">
        <div class="modal-backdrop"></div>
        <div class="modal-window">
            <div class="modal-header">
                <h2 id="modal-title">Add Item</h2>
                <button id="close-entry-btn" class="modal-close-btn" aria-label="Close">&times;</button>
            </div>
            <form id="entry-form" class="entry-form">
                <label>
                    Name
                    <input id="entry-name" type="text" required />
                </label>
                <div id="branch-fields">
                    <label>
                        Location
                        <input id="entry-location" type="text" required />
                    </label>
                    <label>
                        Contact Number
                        <input id="entry-contact" type="tel" inputmode="numeric" pattern="[0-9]+" title="Numbers only" required />
                    </label>
                    <label>
                        Status
                        <select id="entry-status">
                            <option value="Open">Open</option>
                            <option value="Close">Close</option>
                        </select>
                    </label>
                </div>
                <div id="item-fields" class="hidden">
                    <label>
                        Details
                        <textarea id="entry-details" rows="3" required></textarea>
                    </label>
                    <label>
                        Price
                        <input id="entry-price" type="number" min="0" step="0.01" required />
                    </label>
                </div>
                <input id="entry-type" type="hidden" />
                <input id="entry-branch-id" type="hidden" />
                <div class="modal-actions">
                    <button type="button" id="cancel-entry-btn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-add-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirmation-toast" class="confirmation-toast hidden" aria-live="polite" role="status">
        <div class="toast-content">
            <span id="toast-message"></span>
            <button id="toast-close-btn" class="toast-close-btn" aria-label="Dismiss notification">&times;</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
